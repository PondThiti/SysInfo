<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- donut: circumference = 2*pi*250 = 1570.8 -->
  <g transform="rotate(-90 480 460)" fill="none" stroke-width="120" stroke-linecap="butt">
    <circle cx="480" cy="460" r="250" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="480" cy="460" r="250" stroke="url(#a)" stroke-dasharray="740 1570.8"/>
    <circle cx="480" cy="460" r="250" stroke="url(#b)" stroke-dasharray="360 1570.8" stroke-dashoffset="-760"/>
    <circle cx="480" cy="460" r="250" stroke="url(#c)" stroke-dasharray="200 1570.8" stroke-dashoffset="-1140"/>
  </g>
  <!-- port nodes in center -->
  <g fill="#e2e8f0">
    <rect x="410" y="400" width="140" height="100" rx="18" fill="none" stroke="#e2e8f0" stroke-width="16"/>
    <rect x="438" y="428" width="16" height="44" rx="4"/>
    <rect x="472" y="428" width="16" height="44" rx="4"/>
    <rect x="506" y="428" width="16" height="44" rx="4"/>
  </g>
  <!-- magnifier -->
  <circle cx="650" cy="640" r="125" fill="#0b1020" fill-opacity="0.55" stroke="#f8fafc" stroke-width="42"/>
  <line x1="740" y1="730" x2="860" y2="850" stroke="#f8fafc" stroke-width="58" stroke-linecap="round"/>
  <path d="M590 620 a70 70 0 0 1 60 -50" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
</svg>
